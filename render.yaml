# Blueprint do Render: publica a DobraPay no plano grátis.
# Render → "New" → "Blueprint" → escolher este repositório.
# Guia completo: secção "Publicar grátis" do README.
services:
  - type: web
    name: dobrapay
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci --omit=dev --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Endereço da base PostgreSQL grátis do Neon (obrigatório).
      # O disco do Render apaga-se a cada reinício: o dinheiro vive no Neon.
      - key: DATABASE_URL
        sync: false
      # O seu número, com indicativo (ex.: +2399900000): fica administrador.
      - key: ADMIN_PHONE
        sync: false
      # Segredo para os webhooks dos parceiros de pagamento (gerado pelo Render).
      - key: PAYOUT_WEBHOOK_SECRET
        generateValue: true
      # Chave para o gateway USSD da operadora (gerada pelo Render).
      - key: USSD_SECRET
        generateValue: true
      # Carregar com cartão (Stripe): chave secreta (sk_test_… / sk_live_…) e segredo do webhook (whsec_…).
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Códigos de verificação por e-mail (grátis): Resend primeiro, Brevo se a Resend falhar ou chegar ao limite.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM
        sync: false
      # Alertas de movimento por e-mail: segredo do endereço (gerado pelo Render) e remetentes do banco.
      - key: BANK_EMAIL_TOKEN
        generateValue: true
      - key: BANK_EMAIL_SENDERS
        sync: false
